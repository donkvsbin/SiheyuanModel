
#user  nobody;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # 压缩文本类资源，减少移动端首屏 JS/CSS/HTML 下载量
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

    server {
        listen       80;
        server_name  localhost;

        # 构建产物文件名带 hash，可长期不可变缓存
        location ^~ /assets/ {
            root   /opt/project/dist;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # 静态媒体（模型/贴图/音频/视频/Draco 解码器）：
        # 重复访问直接命中浏览器缓存，大幅加快二次加载
        # 注意：模型文件名未带版本号，更新模型后最长需 30 天才会被客户端重新拉取
        location ~* \.(glb|wasm|webp|jpe?g|png|mp3|mp4|ogg|ico)$ {
            root   /opt/project/dist;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        location / {
            root   /opt/project/dist;
            index  index.html index.htm;
            try_files $uri $uri/ index.html;
        }

        # 转发 /api/ 请求到 Spring Boot 后端
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
